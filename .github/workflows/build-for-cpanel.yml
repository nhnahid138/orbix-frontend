name: Build frontend for cPanel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_API_URL: https://orbix.thepixtech.com
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - run: zip -qr orbix-frontend-build.zip .next -x '.next/cache/*' '.next/dev/*'
      - uses: actions/upload-artifact@v4
        with:
          name: orbix-frontend-cpanel
          path: orbix-frontend-build.zip
          if-no-files-found: error
